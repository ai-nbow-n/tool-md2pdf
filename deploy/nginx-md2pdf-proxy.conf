# The trailing slash strips /md2pdf/ before the request reaches Flask, which routes on the bare path;
# ProxyFix only turns X-Forwarded-Prefix into SCRIPT_NAME (what __APP_BASE__ and redirects use).
proxy_pass http://127.0.0.1:2380/;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix /md2pdf;
proxy_read_timeout 220s;
proxy_send_timeout 220s;
client_max_body_size 2m;
proxy_buffering off;
add_header Cache-Control "no-store" always;
