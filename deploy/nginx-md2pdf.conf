# Included inside the nbow.io HTTPS server block. These prefixes must win over
# the site's generic static-file regex so the editor's scripts reach Astro.
location ^~ /en/products/aiconsulting/code-agents/md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
}
location ^~ /de/products/aiconsulting/code-agents/md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
}
location ^~ /es/products/aiconsulting/code-agents/md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
}
