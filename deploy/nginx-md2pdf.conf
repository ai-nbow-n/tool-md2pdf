# Included inside the instrumentainternationalia.com HTTPS server block (deploy/configure_nginx.py adds the
# include). The editor, its API, assets and PDFs live under /md2pdf/ and under the localized /es/md2pdf/ and
# /de/md2pdf/; the app learns each prefix from X-Forwarded-Prefix (ProxyFix with x_prefix=1) and static/i18n.js
# picks the interface language from the first path segment.
location = /md2pdf {
    return 301 /md2pdf/;
}
location ^~ /md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
    proxy_set_header X-Forwarded-Prefix /md2pdf;
}
location = /es/md2pdf {
    return 301 /es/md2pdf/;
}
location ^~ /es/md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
    proxy_set_header X-Forwarded-Prefix /es/md2pdf;
}
location = /de/md2pdf {
    return 301 /de/md2pdf/;
}
location ^~ /de/md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
    proxy_set_header X-Forwarded-Prefix /de/md2pdf;
}
