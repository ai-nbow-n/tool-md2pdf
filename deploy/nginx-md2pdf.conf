# Included inside the instrumentainternationalia.com HTTPS server block (deploy/configure_nginx.py adds the
# include). The editor, its API, assets and PDFs all live under /md2pdf/; the app learns the prefix from
# X-Forwarded-Prefix (ProxyFix with x_prefix=1).
location = /md2pdf {
    return 301 /md2pdf/;
}
location ^~ /md2pdf/ {
    include /etc/nginx/snippets/md2pdf-proxy.conf;
}
